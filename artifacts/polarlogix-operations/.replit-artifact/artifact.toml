kind = "web"
previewPath = "/"
title = "PolarLogix Operations"
description = "A command-center prototype for polar expedition planning, cold-chain cargo telemetry, life-support inventory, personnel safety, and emergency lockdown cascades for NCPOR operations."
version = "1.0.0"
id = "artifacts/polarlogix-operations"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20033

[services.development]
run = "pnpm --filter @workspace/polarlogix-operations run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/polarlogix-operations", "run", "build" ]
serve = "static"
publicDir = "artifacts/polarlogix-operations/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20033"
BASE_PATH = "/"
